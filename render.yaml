services:
  - type: web
    name: frs-ai-model
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -r requirements-ai.txt
    startCommand: python start.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevnteen
          property: connectionString
      - key: AI_MODE
        value: "1"
    healthCheckPath: /api/v1/health
